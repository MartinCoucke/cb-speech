name: Daily CB speeches digest

on:
  schedule:
    # Target: 08:00 Europe/London, year round.
    #
    # GitHub Actions cron is UTC-only and has no timezone support, so a single
    # fixed entry drifts by an hour twice a year: 08:00 London is 07:00 UTC
    # during BST and 08:00 UTC during GMT. Both are scheduled here, and the
    # `gate` job below lets exactly one of them through — whichever currently
    # corresponds to 08:00 in London. This needs no edits at the DST changeover.
    - cron: "0 7 * * *"   # 08:00 London while BST is in effect
    - cron: "0 8 * * *"   # 08:00 London while GMT is in effect
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb-speeches
  cancel-in-progress: false

jobs:
  # Cheap guard so only the cron entry matching 08:00 London proceeds. Runs in
  # seconds and costs a negligible amount of Actions time.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Only continue at 08:00 London
        id: check
        run: |
          HOUR=$(TZ='Europe/London' date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of the clock."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "08" ]; then
            echo "London hour is $HOUR — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "London hour is $HOUR, not 08 — this is the other DST cron entry. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cache the Chromium binary across runs so we don't redownload ~130MB
      # every day (the ECB scraper needs it).
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Always install, never conditionally. playwright is unpinned, so pip can
      # pull a newer version that expects a different Chromium build than the
      # one the cache restored (the cache key only hashes requirements.txt,
      # which does not change). That mismatch silently broke every browser
      # source for 17 runs. `install` is a fast no-op when already present.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify Chromium can actually launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); b.close()
          print("chromium OK")
          PY

      - name: Run digest
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ archive/ runs.log
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) speeches digest"
            git push
          fi
